services:
  - type: web
    name: salgarg-spotify-backend
    runtime: node
    rootDir: spotify-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REFRESH_TOKEN
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://salgarg.github.io
